name: Agent Artifact Renderer

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: agent-artifact-renderer-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.result }}
    steps:
      - name: Detect renderer changes
        id: filter
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              return true;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );
            const exactPaths = new Set([
              ".github/workflows/agent-artifact-renderer.yml",
              "datus-agent/tests/integration/test_artifact_renderer_package.py",
              "datus-agent/tests/unit_tests/agent/node/test_dashboard_html_renderer.py",
              "datus-agent/pyproject.toml",
              "datus-agent/uv.lock",
            ]);

            return files.some(({ filename }) =>
              exactPaths.has(filename) ||
              filename.startsWith("datus-agent/datus/agent/node/visual_artifact/"),
            );

  renderer-package:
    name: Renderer package
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: datus-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: datus-agent/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Verify renderer provenance
        run: node datus/agent/node/visual_artifact/vendor/web_artifact_render_dist/patch-post-message-transport.mjs --check

      - name: Check packaging test style
        run: uv run ruff check tests/integration/test_artifact_renderer_package.py

      - name: Test renderer package
        run: >-
          uv run pytest
          tests/integration/test_artifact_renderer_package.py
          tests/unit_tests/agent/node/test_dashboard_html_renderer.py

  gate:
    name: Agent renderer gate
    needs:
      - changes
      - renderer-package
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RENDERER_RESULT: ${{ needs.renderer-package.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$RENDERER_RESULT" = "success" || test "$RENDERER_RESULT" = "skipped"
