name: Agent Artifact Renderer

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: agent-artifact-renderer-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test change detector
        run: node --test .github/scripts/detect-frontend-changes.test.cjs

      - name: Test workflow policy
        run: node --test .github/scripts/check-workflow-policy.test.cjs

      - name: Check workflow policy
        run: node .github/scripts/check-workflow-policy.cjs

      - name: Detect renderer changes
        id: filter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { detectRendererChanges } = require("./.github/scripts/detect-frontend-changes.cjs");
            const files = context.eventName === "pull_request"
              ? await github.paginate(
                  github.rest.pulls.listFiles,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    per_page: 100,
                  },
                )
              : [];

            return detectRendererChanges(context.eventName, files);

  renderer-package:
    name: Renderer package
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: datus-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: datus-agent/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Verify renderer provenance
        run: node datus/agent/node/visual_artifact/vendor/web_artifact_render_dist/patch-post-message-transport.mjs --check

      - name: Check packaging test style
        run: uv run ruff check tests/integration/test_artifact_renderer_package.py

      - name: Test renderer package
        run: >-
          uv run pytest
          tests/integration/test_artifact_renderer_package.py
          tests/unit_tests/agent/node/test_dashboard_html_renderer.py

  gate:
    name: Agent renderer gate
    needs:
      - changes
      - renderer-package
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test gate verifier
        run: node --test .github/scripts/verify-quality-gate.test.cjs

      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_JOBS: RENDERER
          RENDERER_RELEVANT: ${{ needs.changes.outputs.relevant }}
          RENDERER_RESULT: ${{ needs.renderer-package.result }}
        run: node .github/scripts/verify-quality-gate.cjs
