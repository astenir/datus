name: Python Quality

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: python-quality-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Python changes
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
      db_adapters: ${{ steps.filter.outputs.db_adapters }}
      storage_adapters: ${{ steps.filter.outputs.storage_adapters }}
    steps:
      - name: Detect affected projects
        id: filter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("agent", "true");
              core.setOutput("db_adapters", "true");
              core.setOutput("storage_adapters", "true");
              return;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );
            const filenames = files.map(({ filename }) => filename);
            const workflowChanged = filenames.includes(".github/workflows/python-quality.yml");

            core.setOutput(
              "agent",
              String(workflowChanged || filenames.some(filename => filename.startsWith("datus-agent/"))),
            );
            core.setOutput(
              "db_adapters",
              String(workflowChanged || filenames.some(filename => filename.startsWith("datus-db-adapters/"))),
            );
            core.setOutput(
              "storage_adapters",
              String(workflowChanged || filenames.some(filename => filename.startsWith("datus-storage-adapters/"))),
            );

  agent-quality:
    name: Agent quality
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: datus-agent
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: datus-agent/uv.lock

      - name: Install dependencies
        run: uv sync --locked --group ci

      - name: Run Ruff
        run: uv run ruff check datus tests

      - name: Check release metadata
        run: uv run python ci/check_release_readiness.py

      - name: Validate harness coverage map
        run: uv run python ci/harness/validate_coverage_map.py --strict

      - name: Run portable unit tests
        env:
          DATUS_TEST_LAYER: unit
        run: >-
          uv run pytest -q
          tests/unit_tests/ci
          tests/unit_tests/api/auth
          tests/unit_tests/api/enterprise/test_defaults.py
          tests/unit_tests/api/enterprise/test_route_security_matrix.py
          tests/unit_tests/configuration
          --tb=short
          --disable-warnings

  db-adapters-quality:
    name: DB adapters quality
    needs: changes
    if: needs.changes.outputs.db_adapters == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: datus-db-adapters
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: datus-db-adapters/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run unit tests
        run: ci/run-unit-tests.sh

  storage-adapters-quality:
    name: Storage adapters quality
    needs: changes
    if: needs.changes.outputs.storage_adapters == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: datus-storage-adapters
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Run Ruff
        run: uvx --from ruff==0.15.6 ruff check .

      - name: Run portable unit tests
        run: >-
          uv run --no-project
          --with pytest
          --with-editable ./datus-storage-base
          --with-editable ./datus-storage-oceanbase-mysql
          pytest -q
          datus-storage-oceanbase-mysql/tests/test_oceanbase_mysql_rdb_backend.py::TestBackendConfig
          datus-storage-oceanbase-mysql/tests/test_oceanbase_mysql_rdb_backend.py::TestLogicalDdl
          datus-storage-oceanbase-mysql/tests/test_oceanbase_mysql_vector_backend.py::test_schema_converter_uses_vector_and_indexable_unique_text
          datus-storage-oceanbase-mysql/tests/test_oceanbase_mysql_vector_backend.py::test_parse_vector_dim_from_column_type
          datus-storage-oceanbase-mysql/tests/test_oceanbase_mysql_vector_backend.py::test_vector_dim_from_schema_uses_fixed_size_vector_field
          datus-storage-oceanbase-mysql/tests/test_oceanbase_mysql_vector_backend.py::test_initialize_requires_connection_config
          --tb=short

  gate:
    name: Python quality gate
    needs:
      - changes
      - agent-quality
      - db-adapters-quality
      - storage-adapters-quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AGENT_RESULT: ${{ needs.agent-quality.result }}
          DB_ADAPTERS_RESULT: ${{ needs.db-adapters-quality.result }}
          STORAGE_ADAPTERS_RESULT: ${{ needs.storage-adapters-quality.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$AGENT_RESULT" = "success" || test "$AGENT_RESULT" = "skipped"
          test "$DB_ADAPTERS_RESULT" = "success" || test "$DB_ADAPTERS_RESULT" = "skipped"
          test "$STORAGE_ADAPTERS_RESULT" = "success" || test "$STORAGE_ADAPTERS_RESULT" = "skipped"
