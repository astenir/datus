name: PR Title Check

# 强制 PR 标题遵循 Conventional Commits 规范 `<type>(<scope>): <描述>`，
# 与根级 AGENTS.md 提交规范一致。仅读取 PR 元数据（title/labels），
# 不执行 PR 代码；校验脚本来自 base 分支，pull_request_target 上下文安全。

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - labeled
      - unlabeled

concurrency:
  group: pr-title-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  title-check:
    name: Check PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test title checker
        run: node --test .github/scripts/check-pr-title.test.cjs

      - name: Check PR title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const {
              checkPrTitle,
              FAILURE_LABEL,
            } = require("./.github/scripts/check-pr-title.cjs");

            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((label) => label.name);
            const result = checkPrTitle(pr.title, labels);

            if (result.ignored) {
              core.notice(
                `PR 标题检查已豁免（label: ${result.ignoredBy.join(", ")}）`,
              );
              return;
            }

            if (result.ok) {
              core.info("PR 标题符合 Conventional Commits 规范");
              return;
            }

            core.setFailed(result.reason);
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [FAILURE_LABEL],
              });
            } catch (error) {
              core.info(
                `无法添加 ${FAILURE_LABEL} label（可能尚未创建）：${error.message}`,
              );
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `${result.reason}\n\n修改标题后可自动重新检查。`,
            });
