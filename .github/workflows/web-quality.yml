name: Web Quality

on:
  pull_request:
    paths:
      - ".github/workflows/web-quality.yml"
      - "datus-web/**"
      - "datus-agent/datus/agent/node/visual_artifact/**"
  merge_group:
  workflow_dispatch:

concurrency:
  group: web-quality-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-quality:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: datus-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: datus-web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run renderer browser tests
        run: npm run test:browser

      - name: Check typography
        run: npm run lint:typography

      - name: Build production assets
        run: npm run build
