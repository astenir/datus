name: Web Quality

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: web-quality-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test change detector
        run: node --test .github/scripts/detect-frontend-changes.test.cjs

      - name: Test workflow policy
        run: node --test .github/scripts/check-workflow-policy.test.cjs

      - name: Check workflow policy
        run: node .github/scripts/check-workflow-policy.cjs

      - name: Detect web changes
        id: filter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { detectWebChanges } = require("./.github/scripts/detect-frontend-changes.cjs");
            const files = context.eventName === "pull_request"
              ? await github.paginate(
                  github.rest.pulls.listFiles,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    per_page: 100,
                  },
                )
              : [];

            return detectWebChanges(context.eventName, files);

  web-quality:
    name: Tests and build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: datus-web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: datus-web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Test maintenance rules
        run: npm run test:maintenance

      - name: Check generated OpenAPI types
        run: npm run api:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run renderer browser tests
        run: npm run test:browser

      - name: Check typography
        run: npm run lint:typography

      - name: Build production assets
        run: npm run build

  gate:
    name: Web quality gate
    needs:
      - changes
      - web-quality
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test gate verifier
        run: node --test .github/scripts/verify-quality-gate.test.cjs

      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_JOBS: WEB
          WEB_RELEVANT: ${{ needs.changes.outputs.relevant }}
          WEB_RESULT: ${{ needs.web-quality.result }}
        run: node .github/scripts/verify-quality-gate.cjs
