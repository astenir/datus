name: Web Quality

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: web-quality-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.result }}
    steps:
      - name: Detect web changes
        id: filter
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "pull_request") {
              return true;
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );

            return files.some(({ filename }) =>
              filename === ".github/workflows/web-quality.yml" ||
              filename.startsWith("datus-web/") ||
              filename.startsWith("datus-agent/datus/agent/node/visual_artifact/"),
            );

  web-quality:
    name: Tests and build
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: datus-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: datus-web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Run renderer browser tests
        run: npm run test:browser

      - name: Check typography
        run: npm run lint:typography

      - name: Build production assets
        run: npm run build

  gate:
    name: Web quality gate
    needs:
      - changes
      - web-quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_RESULT: ${{ needs.web-quality.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$WEB_RESULT" = "success" || test "$WEB_RESULT" = "skipped"
