# Docker Compose 本地部署完整配置。
#
# 仓库根目录 docker-compose.yml 和镜像默认命令会通过 --config 显式加载本文件；
# 普通 CLI 不会自动加载它，也不要把它复制为本机 conf/agent.yml。
# 浏览器认证使用 mock userinfo，企业 metadata 和示例 ccks_fund 数据源使用
# Compose PostgreSQL 服务；模型凭据和业务数据源从容器挂载文件合并。
# 这里只支持单 API 进程的本地/测试部署。生产环境仍需真实身份源、密钥、
# 备份、可观测性，以及多进程时的 chat/SSE 状态路由。

agent:
  home: ${DATUS_HOME:-/data/.datus}
  project_root: ${DATUS_PROJECT_ROOT:-/data/project}
  target: ${DATUS_TARGET:-}
  target_provider: ${DATUS_TARGET_PROVIDER:-}
  target_model: ${DATUS_TARGET_MODEL:-}
  models_file: ${DATUS_MODELS_FILE:-/run/datus/agent/models.yml}

  api:
    chat:
      web_filesystem_executor: ${DATUS_WEB_FILESYSTEM_EXECUTOR:-server}
      max_active_global: ${DATUS_CHAT_MAX_ACTIVE_GLOBAL:-32}
      max_active_per_project: ${DATUS_CHAT_MAX_ACTIVE_PER_PROJECT:-16}
      max_active_per_user: ${DATUS_CHAT_MAX_ACTIVE_PER_USER:-4}
      max_buffer_events: ${DATUS_CHAT_MAX_BUFFER_EVENTS:-5000}
      max_buffer_bytes: ${DATUS_CHAT_MAX_BUFFER_BYTES:-16777216}
      stream_delta_batch_interval_ms: ${DATUS_CHAT_STREAM_DELTA_BATCH_INTERVAL_MS:-50}
      stream_delta_batch_chars: ${DATUS_CHAT_STREAM_DELTA_BATCH_CHARS:-1024}
      completed_task_ttl_seconds: ${DATUS_CHAT_COMPLETED_TTL_SECONDS:-300}
      cleanup_interval_seconds: ${DATUS_CHAT_CLEANUP_INTERVAL_SECONDS:-60}
    auth_provider:
      class: datus_enterprise.auth_provider:UserInfoBearerAuthProvider
      kwargs:
        userinfo_url: ${DATUS_ENTERPRISE_USERINFO_URL}
        timeout_seconds: 3.0
        user_id_field: ${DATUS_AUTH_USER_ID_FIELD:-username}
        external_user_id_field: ${DATUS_AUTH_EXTERNAL_USER_ID_FIELD:-userId}
        email_field: ${DATUS_AUTH_EMAIL_FIELD:-email}
        display_name_field: ${DATUS_AUTH_DISPLAY_NAME_FIELD:-realname}
        status_field: ${DATUS_AUTH_STATUS_FIELD:-userStatus}
        allowed_statuses: ["${DATUS_AUTH_ALLOWED_STATUS:-正常}"]
        default_project_id: ${DATUS_AUTH_DEFAULT_PROJECT_ID:-enterprise}

  enterprise:
    enabled: true

    authorization_provider:
      class: datus.api.enterprise.defaults:LocalAuthorizationProvider

    config_projector:
      class: datus_enterprise.projection:DatasourceGrantProjector

    user_auto_provisioning:
      enabled: false
      default_role_ids: []

    user_model_credentials:
      custom_openai_compatible:
        enabled: false
        allowed_base_urls: ["http://localhost:8000/v1", "https://models.corp/*"]

    user_datasources:
      enabled: false
      allowed_types: [postgresql, mysql, oceanbase]
      allowed_hosts: [localhost, 127.0.0.1, "*.corp"]
      default_ports:
        postgresql: "5432"
        mysql: "3306"
        oceanbase: "2881"

    # 普通用户个人 MCP，默认关闭；allowed_hosts 不能为空。
    # allow_insecure_http（允许 http:// 明文）与 allow_private_hosts（允许私网/回环）
    # 为受控放开开关，默认 false，仅建议在本地或隔离环境开启。
    user_mcp:
      enabled: false
      allowed_hosts: []
      allow_insecure_http: false
      allow_private_hosts: false
      max_servers_per_user: 10
      max_selected_per_session: 3
      timeout_seconds: 30

    user_store:
      class: datus_enterprise.postgres_stores:PgEnterpriseUserStore
      kwargs: &enterprise_pg
        dsn: ${DATUS_ENTERPRISE_PG_DSN}
        min_size: 1
        max_size: 1

    role_store:
      class: datus_enterprise.postgres_stores:PgEnterpriseRoleStore
      kwargs: *enterprise_pg

    datasource_grant_store:
      class: datus_enterprise.postgres_stores:PgEnterpriseDatasourceGrantStore
      kwargs: *enterprise_pg

    agent_store:
      class: datus_enterprise.postgres_stores:PgEnterpriseAgentStore
      kwargs: *enterprise_pg

    session_owner_store:
      class: datus_enterprise.postgres_stores:PgSessionOwnerStore
      kwargs: *enterprise_pg

    session_body_store:
      class: datus_enterprise.postgres_session_store:PgSessionBodyStore
      kwargs: *enterprise_pg

    artifact_acl_store:
      class: datus_enterprise.postgres_stores:PgArtifactAclStore
      kwargs: *enterprise_pg

    audit_sink:
      class: datus_enterprise.postgres_stores:PgAuditSink
      kwargs: *enterprise_pg

    quota_store:
      class: datus_enterprise.postgres_stores:PgEnterpriseQuotaStore
      kwargs: *enterprise_pg

    secret_store:
      class: datus_enterprise.postgres_stores:PgEnterpriseSecretStore
      kwargs: *enterprise_pg

    user_model_credential_store:
      class: datus_enterprise.postgres_stores:PgUserModelCredentialStore
      kwargs:
        <<: *enterprise_pg
        encryption_secret: ${DATUS_USER_MODEL_CREDENTIAL_SECRET}

    user_datasource_store:
      class: datus_enterprise.postgres_stores:PgUserDatasourceStore
      kwargs:
        <<: *enterprise_pg
        encryption_secret: ${DATUS_USER_DATASOURCE_SECRET}

    # 仅当 user_mcp 开启时需要；DATUS_USER_MCP_SECRET 至少 32 字符，并须和 metadata 备份一起恢复。
    user_mcp_server_store:
      class: datus_enterprise.postgres_stores:PgUserMcpServerStore
      kwargs:
        <<: *enterprise_pg
        encryption_secret: ${DATUS_USER_MCP_SECRET}

  sql_policy:
    enabled: false

  providers:
    deepseek:
      api_key: ${DEEPSEEK_API_KEY}
      base_url: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    openai:
      api_key: ${OPENAI_API_KEY}
      base_url: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    claude:
      api_key: ${ANTHROPIC_API_KEY}
    gemini:
      api_key: ${GEMINI_API_KEY}

  models:
    compose_embedding:
      type: openai
      model: ${DATUS_EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      base_url: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      api_key: ${SILICONFLOW_API_KEY}

  nodes:
    schema_linking:
      matching_rate: fast
    reasoning:
      max_table_schemas_length: 4000
      max_data_details_length: 2000
      max_context_length: 8000
      max_value_length: 500
    output:
      check_result: true
    chat:
      workspace_root: sql2
      max_turns: 25

  services:
    # Optional: mount a datasource YAML file and add/override entries without
    # rebuilding the image or declaring one env var per datasource field.
    datasources_file: ${DATUS_DATASOURCES_FILE:-/run/datus/agent/datasources.yml}

    datasources:
      ccks_fund:
        type: postgresql
        host: ${CCKS_FUND_DB_HOST:-postgres}
        port: "${CCKS_FUND_DB_PORT:-5432}"
        username: ${CCKS_FUND_DB_USER:-datus}
        password: ${CCKS_FUND_DB_PASSWORD:-datus}
        database: ${CCKS_FUND_DB_NAME:-ccks_fund}
        enumerate_databases: ${CCKS_FUND_ENUMERATE_DATABASES:-false}
        schema: ${CCKS_FUND_DB_SCHEMA:-public}
        sslmode: ${CCKS_FUND_DB_SSLMODE:-prefer}
        timeout_seconds: 30
        default: true

      external_postgres:
        type: ${DATUS_EXTERNAL_DATASOURCE_TYPE:-postgresql}
        host: ${DATUS_EXTERNAL_POSTGRES_HOST:-postgres}
        port: "${DATUS_EXTERNAL_POSTGRES_PORT:-5432}"
        username: ${DATUS_EXTERNAL_POSTGRES_USER:-datus}
        password: ${DATUS_EXTERNAL_POSTGRES_PASSWORD:-datus}
        database: ${DATUS_EXTERNAL_POSTGRES_DATABASE:-ccks_fund}
        schema: ${DATUS_EXTERNAL_POSTGRES_SCHEMA:-public}
        sslmode: ${DATUS_EXTERNAL_POSTGRES_SSLMODE:-prefer}
        timeout_seconds: 30
        default: false

    semantic_layer:
      metricflow:
        type: metricflow
    bi_platforms: {}
    schedulers: {}

  storage:
    embedding_device_type: cpu
    database: &local_embedding
      registry_name: openai
      model_name: ${DATUS_EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B}
      dim_size: ${DATUS_EMBEDDING_DIM_SIZE:-1024}
      batch_size: 10
      target_model: ${DATUS_EMBEDDING_MODEL_KEY:-compose_embedding}
    document: *local_embedding
    metric: *local_embedding
    semantic_model: *local_embedding
    reference_sql: *local_embedding

  workflow:
    plan: planA
    planA:
      - schema_linking
      - gen_sql
      - output
