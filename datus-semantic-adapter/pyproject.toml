[tool.uv.workspace]
# datus-semantic-osi-engine is tested in isolation until the unpublished
# datus-osi-engine wheel can be resolved by this lockable workspace.
members = ["datus-semantic-core", "datus-semantic-metricflow", "datus-semantic-osi"]

[tool.uv.sources]
datus-metricflow = { path = "../metricflow", editable = true }

[tool.pytest.ini_options]
# The OSI Engine adapter is outside this lockable workspace and has its own
# isolated unit-test invocation in CI.
testpaths = [
    "datus-semantic-core/tests",
    "datus-semantic-metricflow/datus_semantic_metricflow/tests",
    "datus-semantic-osi/tests",
]
