# Copy this file to `deploy/docker/agent/models.yml` for local Docker Compose
# usage. The copied file is git-ignored because it may contain real API keys.
#
# This file can hold:
# - provider credentials/base_url overrides for catalog providers
# - custom model entries for private or self-hosted endpoints
# - embedding model entries such as compose_embedding
#
# `.env` should only select the active model:
#   DATUS_TARGET_PROVIDER=deepseek
#   DATUS_TARGET_MODEL=deepseek-v4-flash
# or, for a custom model entry:
#   DATUS_TARGET=my_private_model
#   DATUS_TARGET_PROVIDER=
#   DATUS_TARGET_MODEL=

providers:
  deepseek:
    api_key: change-me
    base_url: https://api.deepseek.com

models:
  # Embedding model used by the Docker compose config. The storage section in
  # datus-agent/conf/agent.compose.yml points to this key with:
  #   target_model: ${DATUS_EMBEDDING_MODEL_KEY:-compose_embedding}
  # To use a different key, set DATUS_EMBEDDING_MODEL_KEY=<your_key> and define
  # a matching models.<your_key> entry here.
  # If you switch to a different embedding model, update
  # DATUS_EMBEDDING_MODEL_NAME and DATUS_EMBEDDING_DIM_SIZE in `.env`.
  compose_embedding:
    type: openai
    model: Qwen/Qwen3-Embedding-0.6B
    base_url: https://api.siliconflow.cn/v1
    api_key: change-me

  # Add private or self-hosted model entries here and select one with
  # DATUS_TARGET. Keep only entries that are actually configured; startup
  # validation rejects leftover `change-me` credentials.
